name: Release

on:
  push:
    branches:
      - main
      # Aggiungi altri ambienti qui, es:
      # - beta
      # - alpha

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write  # Richiesto per npm provenance (OIDC, senza NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pubblicazione su npm via OIDC provenance — nessun NPM_TOKEN necessario.
          # Requisito: abilitare "Trusted Publishing" per questo repo su npmjs.com
          # (Account → Package → Settings → Publish granular access token / OIDC)
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release