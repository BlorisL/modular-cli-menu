version: 2

updates:
  # Aggiornamenti dipendenze npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      devDependencies:
        dependency-type: "development"
      dependencies:
        dependency-type: "production"

  # Aggiornamenti GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
